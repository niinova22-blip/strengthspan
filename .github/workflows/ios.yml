name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode sürümü
        run: xcodebuild -version

      # XcodeGen yalnızca CI aracıdır; .xcodeproj depoda tutulmaz.
      - name: Xcode projesini üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Testler (birim + UI, simülatör)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))
          ")
          echo "Simülatör: $UDID"
          set -o pipefail
          xcodebuild test \
            -project Strengthspan.xcodeproj \
            -scheme Strengthspan \
            -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: İmzasız Release derlemesi (cihaz)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Strengthspan.xcodeproj \
            -scheme Strengthspan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Test sonuçlarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-xcresult
          path: ${{ runner.temp }}/Tests.xcresult
